# Curated projection into a separate front-facing repository.
# Sources are relative to this repository; targets are relative to the front repo.
# Leave the target empty and pass --target-repo for portability.

[settings]
target = ""

[ignore]
names = ["__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "build", "dist"]
suffixes = [".pyc", ".pyo"]
globs = ["*.egg-info", ".codex_tmp*"]

